version: '3.8'

services:
  # PostgreSQL для хранения данных
  postgres-analytics:
    image: postgres:15
    container_name: data-portfolio-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_ROOT_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"  # Используем другой порт, чтобы не конфликтовать
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - analytics-net

  # Metabase для визуализации
  metabase:
    image: metabase/metabase:latest
    container_name: data-portfolio-metabase
    ports:
      - "${METABASE_PORT}:3000"  # Используем 3033, чтобы не конфликтовать
    environment:
      MB_DB_TYPE: ${MB_DB_TYPE}
      MB_DB_DBNAME: ${MB_DB_DBNAME}
      MB_DB_HOST: ${MB_DB_HOST}
      MB_DB_PORT: ${MB_DB_PORT}
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
    depends_on:
      postgres-analytics:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase.db
    networks:
      - analytics-net

  # PgAdmin для управления БД (опционально)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: data-portfolio-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres-analytics
    networks:
      - analytics-net

volumes:
  postgres_data:
  metabase_data:

networks:
  analytics-net:
    driver: bridge
