name: CI / Test Portfolio

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
    
    - name: Run tests for SQL Fintech
      run: |
        cd project-02-sql-fintech
        pytest tests/ -v --tb=short
    
    - name: Check Python syntax
      run: |
        python -m py_compile project-01-software-eda/src/analyze_software.py || true
        python -m py_compile project-02-sql-fintech/src/init_db.py || true
        python -m py_compile airflow-dag/ecommerce_dag.py || true
    
    - name: Check SQL files
      run: |
        for sql_file in $(find . -name "*.sql" -type f); do
          echo "✅ Checking $sql_file"
        done
